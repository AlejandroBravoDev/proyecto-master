appId: com.sistemarestaurante.pos
productName: Sistema Restaurante
copyright: Copyright © 2026 Sistema Restaurante

directories:
  output: dist_electron
  buildResources: build

files:
  - electron/dist/**/*
  - package.json

extraResources:
  - from: backend/dist
    to: backend/dist
  - from: backend/prisma
    to: backend/prisma
  - from: backend/node_modules
    to: backend/node_modules
  - from: frontend/dist
    to: frontend/dist

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "SistemaRestaurante-Setup.${ext}"
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Sistema Restaurante"
  uninstallDisplayName: "Sistema Restaurante"
  deleteAppDataOnUninstall: false
